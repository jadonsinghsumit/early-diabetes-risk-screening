[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "early-diabetes-screening"
version = "0.1.0"
description = "Reproducible BRFSS ingestion, quality checks, exploration, and association tests"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<4", "numpy>=1.26,<3", "scipy>=1.12,<2", "statsmodels>=0.14,<1", "matplotlib>=3.8,<4", "seaborn>=0.13,<1",
                "scikit-learn>=1.4,<2", "xgboost>=2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "build>=1,<2"]

[project.scripts]
diabetes-screening = "diabetes_screening.cli:main"
diabetes-screening-model = "diabetes_screening.modeling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=diabetes_screening --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
